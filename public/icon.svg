<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA033"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#006C4A"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#702000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grocery pattern / circular glow -->
  <circle cx="256" cy="220" r="170" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Main Storefront Illustration -->
  <g filter="url(#dropShadow)" transform="translate(256, 215)">
    <!-- Awning / Roof -->
    <path d="M-130,-40 L130,-40 L110,-100 L-110,-100 Z" fill="#FFFFFF"/>
    <!-- Awning stripes -->
    <path d="M-110,-100 L-80,-100 L-95,-40 L-130,-40 Z" fill="#E65100" fill-opacity="0.2"/>
    <path d="M-40,-100 L-10,-100 L-25,-40 L-55,-40 Z" fill="#E65100" fill-opacity="0.2"/>
    <path d="M30,-100 L60,-100 L45,-40 L15,-40 Z" fill="#E65100" fill-opacity="0.2"/>
    <path d="M100,-100 L110,-100 L130,-40 L85,-40 Z" fill="#E65100" fill-opacity="0.2"/>
    
    <!-- Awning scalloped edge -->
    <path d="M-130,-40 Q-112.5,-20 -95,-40 Q-77.5,-20 -60,-40 Q-42.5,-20 -25,-40 Q-7.5,-20 10,-40 Q27.5,-20 45,-40 Q62.5,-20 80,-40 Q97.5,-20 115,-40 Q122.5,-30 130,-40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

    <!-- Store Base Building -->
    <rect x="-105" y="-30" width="210" height="135" rx="12" fill="#FFFFFF"/>
    
    <!-- Doorway -->
    <path d="M-32,105 L-32,30 Q-32,15 0,15 Q32,15 32,30 L32,105 Z" fill="url(#bgGrad)"/>
    <circle cx="18" cy="65" r="4" fill="#FFFFFF"/>

    <!-- Windows with Grocery Items -->
    <!-- Left Window -->
    <rect x="-90" y="-12" width="45" height="50" rx="6" fill="#F3F4F5"/>
    <path d="M-78,25 L-57,25 L-53,7 L-82,7 Z" fill="url(#accentGrad)"/>
    <circle cx="-67" cy="0" r="6" fill="#FF8C00"/>

    <!-- Right Window -->
    <rect x="45" y="-12" width="45" height="50" rx="6" fill="#F3F4F5"/>
    <path d="M57,25 L78,25 L82,7 L53,7 Z" fill="url(#accentGrad)"/>
    <circle cx="67" cy="0" r="6" fill="#FF8C00"/>

    <!-- Fresh Leaf Badge in Center Above Door -->
    <circle cx="0" cy="-65" r="28" fill="#FFFFFF"/>
    <circle cx="0" cy="-65" r="24" fill="url(#accentGrad)"/>
    <!-- Leaf symbol -->
    <path d="M-8,-60 C-8,-74 5,-77 10,-77 C10,-72 9,-58 -1,-54 C-5,-52 -8,-56 -8,-60 Z" fill="#FFFFFF"/>
    <path d="M-8,-60 C-3,-65 4,-67 10,-77" stroke="#006C4A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Label Badge: AMMA IKA -->
  <g transform="translate(256, 420)">
    <rect x="-135" y="-28" width="270" height="56" rx="28" fill="#FFFFFF" filter="url(#dropShadow)"/>
    <text x="0" y="9" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#904D00" text-anchor="middle" letter-spacing="2.5">AMMA IKA</text>
  </g>
</svg>
